# Development: PostgreSQL only — the app runs in your local venv (make run).
# Redis and MinIO join this file at their feature levels.
name: dms-dev

services:
  postgres:
    container_name: "dms_dev_postgres"
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-dms}
      POSTGRES_USER: ${DB_USER:-dms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dms} -d ${DB_NAME:-dms}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
