# WebSocket upgrade support (http context — shared by all servers below)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Re-resolve "web" via Docker's DNS instead of caching its IP at startup
# (a recreated container gets a new IP — cached IPs caused the 502s earlier)
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;      # WebSockets are long-lived
    }
}

