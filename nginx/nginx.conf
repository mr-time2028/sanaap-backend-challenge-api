upstream django {
    server web:8000;
}

# --- HTTPS (enable on a real server) ---
# 1) easiest: certbot --nginx -d yourdomain.com  (writes the 443 block for you)
# 2) manual equivalent:
#
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }
# server {
#     listen 443 ssl;
#     server_name yourdomain.com;
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     client_max_body_size 50m;
#     location /static/ { alias /staticfiles/; }
#     location / {
#         proxy_pass http://django;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

server {
    listen 80;
    server_name _;

    # keep this comfortably above MAX_UPLOAD_SIZE so Django's own validation
    # (not nginx) produces the friendly error response
    client_max_body_size 50m;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
