[mypy]
plugins = mypy_django_plugin.main
disallow_untyped_defs = True
exclude = migrations

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-drf_spectacular.*]
ignore_missing_imports = True

[mypy-minio.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-decouple]
ignore_missing_imports = True

[mypy-channels_redis]
ignore_missing_imports = True
